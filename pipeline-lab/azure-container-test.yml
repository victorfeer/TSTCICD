
trigger: none
pr: none

pool:
  vmImage: 'ubuntu-24.04'

jobs:
- job: TestarJava8
  displayName: 'Validar container Maven Java 8'

  container:
    image: 'maven:3.9.9-eclipse-temurin-8'

  steps:
  - checkout: self

  - script: |
      echo "Verificando Java:"
      java -version

      echo "Verificando Maven:"
      mvn -version

      echo "Verificando sistema operacional:"
      cat /etc/os-release
    displayName: 'Validar ambiente de compilacao'
