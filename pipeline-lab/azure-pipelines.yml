
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: CI
  displayName: 'CI - Compilar, testar e publicar JAR'
  jobs:
  - job: BuildTest
    displayName: 'Build e testes Java 8'
    steps:
    - checkout: self

    - task: JavaToolInstaller@0
      displayName: 'Configurar Java 8'
      inputs:
        versionSpec: '8'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - script: mvn -B clean verify
      displayName: 'Build e testes unitarios'
      workingDirectory: '$(Build.SourcesDirectory)/pipeline-lab'

    - task: PublishTestResults@2
      displayName: 'Publicar resultados dos testes'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        searchFolder: '$(Build.SourcesDirectory)/pipeline-lab'
        failTaskOnFailedTests: true

    - script: |
        echo "Verificando JAR gerado..."
        ls -lah target/
        find target/ -maxdepth 1 -name '*.jar' -print
        test -n "$(find target/ -maxdepth 1 -name '*.jar' -print -quit)"
      displayName: 'Validar artefato JAR'
      workingDirectory: '$(Build.SourcesDirectory)/pipeline-lab'

    - publish: '$(Build.SourcesDirectory)/pipeline-lab/target'
      artifact: jar-build
      displayName: 'Publicar artefato de CI'

- stage: DEV
  displayName: 'CD - DEV simulado'
  dependsOn: CI
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployDev
    environment: 'lab-dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: jar-build
          - script: |
              echo 'Simulando deploy em DEV'
              find "$(Pipeline.Workspace)/jar-build" -name '*.jar' -print

- stage: HML
  displayName: 'CD - HML simulado'
  dependsOn: DEV
  jobs:
  - deployment: DeployHml
    environment: 'lab-hml'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: jar-build
          - script: |
              echo 'Simulando homologacao do mesmo artefato'
              find "$(Pipeline.Workspace)/jar-build" -name '*.jar' -print

- stage: PROD
  displayName: 'CD - PROD simulado'
  dependsOn: HML
  jobs:
  - deployment: DeployProd
    environment: 'lab-prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: jar-build
          - script: |
              echo 'Simulando deploy em PROD apos aprovacao'
              find "$(Pipeline.Workspace)/jar-build" -name '*.jar' -print
