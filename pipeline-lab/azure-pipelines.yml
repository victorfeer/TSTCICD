trigger:
  branches:
    include:
      - main
pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: CI
  displayName: 'CI - Compilar, testar e publicar JAR'
  jobs:
  - job: BuildTest
    steps:
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '8'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'
    - script: mvn -B clean verify
      displayName: 'Build e testes unitarios'
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        failTaskOnFailedTests: true
    - publish: '$(Build.SourcesDirectory)/target'
      artifact: jar-build
      displayName: 'Publicar artefato de CI'

- stage: DEV
  displayName: 'CD - DEV simulado'
  dependsOn: CI
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployDev
    environment: 'lab-dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: jar-build
          - script: |
              echo 'Simulando deploy em DEV'
              find "$(Pipeline.Workspace)/jar-build" -name '*.jar' -print

- stage: HML
  displayName: 'CD - HML simulado'
  dependsOn: DEV
  jobs:
  - deployment: DeployHml
    environment: 'lab-hml'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: jar-build
          - script: echo 'Simulando homologacao do mesmo artefato'

- stage: PROD
  displayName: 'CD - PROD simulado (aprovacao no Environment)'
  dependsOn: HML
  jobs:
  - deployment: DeployProd
    environment: 'lab-prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: jar-build
          - script: echo 'Simulando deploy em PROD apos aprovacao'
